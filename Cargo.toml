[package]
name = "AsciiMLN"
version = "1.1.0"
edition = "2024"
authors = ["WTRMLNv1"]
license = "MIT"
description = "Minecraft, but in your terminal"

[[bin]]
# Keep the crate name descriptive while making the installed command short and stable.
name = "asciimln"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
noise = "0.9.0"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
